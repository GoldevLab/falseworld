name: Fly Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - name: Checkout falseworld
        uses: actions/checkout@v4
        with:
          path: falseworld

      # Path dependency: resuma = { path = "../resuma/crates/resuma" }
      - name: Checkout resuma
        uses: actions/checkout@v4
        with:
          repository: GoldevLab/resuma
          path: resuma

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        working-directory: falseworld
        run: ./scripts/fly-deploy.sh --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
